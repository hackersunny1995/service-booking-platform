# Production Configuration for Supabase PostgreSQL
# Using environment variables for security
# Additional params: prepareThreshold=0 (disable prepared statements for pooler compatibility)
# preferQueryMode=simple (use simple query mode, not extended protocol)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.jyrpmaqkvpxbcstnogap.supabase.co:5432/postgres?sslmode=require&prepareThreshold=0&preferQueryMode=simple}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Home@prime#$}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings for Supabase
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgresql

# NEVER auto-clean in prod
spring.flyway.clean-on-validation-error=false
spring.flyway.clean-disabled=true

# MOST IMPORTANT — Flyway + Supabase fix
spring.flyway.execute-in-transaction=false

# Validation ko thoda shaant kar
spring.flyway.validate-on-migrate=false


# Important for Supabase
spring.flyway.validate-on-migrate=true


# Server Configuration
server.port=${PORT:8080}

# CORS Configuration (for production - will be updated with actual frontend URL)
cors.allowed-origins=https://*.github.io,http://localhost:*,http://127.0.0.1:*

# JWT Configuration
jwt.secret=${JWT_SECRET:homeprime99-secret-key-change-this-in-production-make-it-very-long-and-secure}
jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.com.servicebooking=INFO
logging.level.org.springframework.web=INFO

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_1DP5mmOlF5G5ag}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:YOUR_RAZORPAY_SECRET_KEY_HERE}
