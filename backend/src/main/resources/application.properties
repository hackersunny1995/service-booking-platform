# Application Name
spring.application.name=homeprime99-backend

# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/homeprime99
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT Configuration
jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
jwt.expiration=86400000

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# File Storage (Local for development, switch to S3 for production)
file.upload-dir=uploads/
file.storage-type=local

# AWS S3 Configuration (for production)
aws.s3.bucket-name=service-booking-files
aws.s3.region=us-east-1

# Firebase Configuration
firebase.service-account-key=src/main/resources/firebase-adminsdk.json

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:8080

# Logging
logging.level.com.servicebooking=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO

# API Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
