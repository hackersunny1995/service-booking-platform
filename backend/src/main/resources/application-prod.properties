# Production Configuration for Supabase PostgreSQL
# Using environment variables for security
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.jyrpmaqkvpxbcstnogap.supabase.co:5432/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Home@prime#$}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings for Supabase
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgresql

# Server Configuration
server.port=${PORT:8080}

# CORS Configuration (for production - will be updated with actual frontend URL)
cors.allowed-origins=https://*.github.io,http://localhost:*,http://127.0.0.1:*

# JWT Configuration
jwt.secret=${JWT_SECRET:homeprime99-secret-key-change-this-in-production-make-it-very-long-and-secure}
jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.com.servicebooking=INFO
logging.level.org.springframework.web=INFO
